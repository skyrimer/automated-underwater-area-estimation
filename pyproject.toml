[project]
name = "automated-underwater-area-estimation"
version = "0.1.0"
description = "Automated Underwater Area Estimation using Deep Learning"
authors = [
    {name = "Kirill Chekmenev", email = "chekmenev2004@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "tqdm (>=4.67.1,<5.0.0)",
    "transformers (>=4.56,<5.0.0,!=4.57.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "google-cloud-storage (>=3.4.1,<4.0.0)",
    "pycocotools (>=2.0.10,<3.0.0)",
    "protobuf (>=6.32.1,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "opencv-python (>=4.12.0.88,<5.0.0.0)",
    "ultralytics (>=8.3.208,<9.0.0)",
    "scikit-image (>=0.25.2,<0.26.0)",
    "torch (>=2.8.0,<3.0.0)",
    "torchvision (>=0.23.0,<0.24.0)",
    "albumentationsx (>=2.0.12,<3.0.0)",
    "evaluate (>=0.4.6,<0.5.0)",
    "hf-xet (>=1.1.10,<2.0.0)",
    "accelerate (>=1.10.1,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
notebook = "^7.4.5"
ipywidgets = "^8.1.7"
pytest = "^8.4.2"
streamlit = "^1.50.0"
streamlit-image-coordinates = "^0.4.0"
segment-anything = "^1.0"



[tool.poetry.group.cuda.dependencies]
torch = {version = "^2.8.0", source = "pytorch-cu129"}
torchvision = {version = "^0.23.0", source = "pytorch-cu129"}

[[tool.poetry.source]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
priority = "explicit"

[tool.black]
exclude = '''
/(
    \.git
    | \.venv
    | \.tox
    | \.eggs
    | \.mypy_cache
    | \.pytest_cache
    | __pycache__
    | automated_underwater_area_estimation/data
    | automated_underwater_area_estimation/data_preprocessed
)/
'''